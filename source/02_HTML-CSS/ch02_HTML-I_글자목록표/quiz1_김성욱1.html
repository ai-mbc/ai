<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title>회원가입</title>
  <link rel="stylesheet" href="quiz1_김성욱1.css" />
</head>
<body>
  <div id="wrap">
    <header>
      <h1>회원가입</h1>
    </header>

    <section>
      <form name="frm" method="post" onsubmit="return chk()">
        <fieldset>
          <legend>필수입력</legend>
          <table class="formTable">
              <tr>
                  <th>이름*</th>
                  <td>
                      <input type="text" name="userName" id="userName"
                             placeholder="이름은 2글자 이상" />
                  </td>
              </tr>
            <tr>
              <th>아이디*</th>
              <td>
                <input type="text" name="id" id="id"
                       placeholder="ID는 4글자 이상" />
              </td>
            </tr>
            <tr>
                <th>비밀번호*</th>
                <td>
                    <input type="password" name="pw" id="pw"
                           placeholder="비밀번호 1글자 이상" />
                </td>
            </tr>
            <tr>
                <th>비번확인*</th>
                <td>
                    <input type="password" name="pwChk" id="pwChk"
                           placeholder="확인용 비밀번호" />
                </td>
            </tr>
            <tr>
                <th>전화*</th>
                <td>
                    <input type="text" name="tel" id="tel"
                           placeholder="02-716-1006 / 010-9999-9999" />
                </td>
            </tr>
            <tr>
                <th>E-mail*</th>
                <td>
                    <input type="text" name="email" id="email"
                           placeholder="id@domain.com 또는 한글@domain.co.kr" />
                </td>
            </tr>
          </table>
        </fieldset>

        <fieldset>
          <legend>추가 입력 사항</legend>
          <table class="formTable">
            <tr>
              <td><label for="job">직업</label></td>
              <td>
                <select name="job" id="job">
                  <option value="">선택</option>
                  <option value="회사원">회사원</option>
                  <option value="자영업">자영업</option>
                  <option value="학생">학생</option>
                  <option value="주부">주부</option>
                  <option value="기타">기타</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>결혼 유무</td>
              <td>
                <label>
                  <input type="radio" name="marriage" value="기혼" />기혼
                </label>
                <label>
                  <input type="radio" name="marriage" value="미혼" />미혼
                </label>
              </td>
            </tr>
            <tr>
              <td>자식</td>
              <td>
                <label>
                  <input type="checkbox" name="children" value="아들" />아들
                </label>
                <label>
                  <input type="checkbox" name="children" value="딸" />딸
                </label>
              </td>
            </tr>
            <tr>
              <td><label for="region">지역</label></td>
              <td>
                  <select name="region" id="region">
                      <option value="">선택</option>
                      <option value="서울">서울</option>
                      <option value="경기">경기</option>
                      <option value="인천">인천</option>
                      <option value="강원">강원</option>
                      <option value="충청">충청</option>
                      <option value="전라">전라</option>
                      <option value="경상">경상</option>
                      <option value="제주">제주</option>
                      <option value="부산">부산</option>
                      <option value="LA">LA</option>
                  </select>
              </td>
            </tr>
          </table>
        </fieldset>

        <div id="buttonArea">
          <input type="submit" value="가입" />
          <input type="reset" value="취소" />
        </div>
      </form>
    </section>

    <footer>
      <hr />
      <p>서울시 관악구 신림로 364, 우장BD 503호</p>
      <p>Copyright ⓒ XX All rights reserved</p>
    </footer>
  </div>

  <script>
    function chk() {
      var telPattern = /^(02-\d{3,4}-\d{4}|01[016789]-\d{3,4}-\d{4})$/;
      var emailPattern = /^[A-Za-z가-힣][A-Za-z0-9가-힣._-]*@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$/;

      if (frm.userName.value.trim().length < 2) {
        alert('이름은 2글자 이상 필수입력입니다');
        frm.userName.focus();
        return false;
      } else if (frm.id.value.trim().length < 4) {
        alert('아이디는 4글자 이상 필수입력입니다');
        frm.id.focus();
        return false;
      } else if (frm.pw.value.length < 1) {
        alert('비밀번호는 1글자 이상 필수입력입니다');
        frm.pw.focus();
        return false;
      } else if (frm.pwChk.value.length < 1) {
        alert('확인용 비밀번호를 입력하세요');
        frm.pwChk.focus();
        return false;
      } else if (frm.pw.value != frm.pwChk.value) {
        alert('비밀번호를 확인하세요');
        frm.pw.value = '';
        frm.pwChk.value = '';
        frm.pw.focus();
        return false; // submit 제한
      } else if (!telPattern.test(frm.tel.value.trim())) {
        alert('전화번호 형식을 확인하세요');
        frm.tel.focus();
        return false;
      } else if (!emailPattern.test(frm.email.value.trim())) {
        alert('이메일 형식을 확인하세요. 숫자로 시작할 수 없습니다');
        frm.email.focus();
        return false;
      }

      alert('회원가입 입력이 완료되었습니다');
      return true;
    }
  </script>
</body>
</html>
