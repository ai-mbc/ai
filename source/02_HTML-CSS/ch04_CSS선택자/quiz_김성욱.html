<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>레이아웃 퀴즈</title>
    <style>
        /*** 전체적인 레이아웃 ***/
        #header, #content, #footer {
            width: 1000px;
            margin: 0 auto;
            overflow: hidden;
        }

            #header > div, #content > div, #footer > div {
                float: left;
                border: 1px solid gray;
                background-color: lightgray;
            }

        .left, .right {
            width: 150px;
            height: 150px;
        }

        .center {
            width: 692px;
            height: 150px;
        }

        #content > div {
            height: 300px;
        }

        /*** border 둥글리기 ***/
        #header .left, #footer .right {
            border-radius: 30px 0;
        }

        #header .center {
            border-radius: 0 0 30px 30px;
        }

        #header .right, #footer .left {
            border-radius: 0 30px;
        }

        #content .left {
            border-radius: 0 30px 30px 0;
        }

        #content .center {
            border-radius: 30px;
        }

        #content .right {
            border-radius: 30px 0 0 30px;
        }

        #footer .center {
            border-radius: 30px 30px 0 0;
        }

        /*** #content .center 안의 메뉴와 본문 ***/
        #content .center ul {
            overflow: hidden;
            margin: 30px 0;
            padding: 0;
        }

            #content .center ul li {
                float: left;
                width: 33%;
                list-style: none;
                text-align: center;
                font-size: 2em;
                font-weight: bold;
            }

        #content .center a {
            color: black;
            text-decoration: none;
        }

        #content .center h2 {
            margin-top: 45px;
            text-align: center;
            font-size: 2em;
        }

        #content .center p {
            padding: 40px 15px 30px;
            font-size: 1.1em;
            line-height: 1.5;
        }

        /*** #content .right의 마지막 3개 목록만 빨간색 ***/
        #content .right li:nth-child(9) ~ li {
            color: red;
        }
    </style>
</head>
<body>
    <div id="header">
        <div class="left"></div>
        <div class="center"></div>
        <div class="right"></div>
    </div>

    <div id="content">
        <div class="left"></div>

        <div class="center">
            <div id="nav">
                <ul>
                    <li><a href="#1">menu1</a></li>
                    <li><a href="#2">menu2</a></li>
                    <li><a href="#3">menu3</a></li>
                </ul>
            </div>

            <div id="academy">
                <h2>AI 개발자 양성과정</h2>
                <p>파이썬, 웹표준, DBMS, 딥러닝, 자연어처리, 생성형 ai, 머신러닝, 프로젝트, 웹프레임워크</p>
            </div>
        </div>

        <div class="right">
            <ol>
                <li>태그</li>
                <li>전체(*)</li>
                <li>id, class</li>
                <li>속성</li>
                <li>후손, 자손(&gt;)</li>
                <li>동위</li>
                <li>반응</li>
                <li>상태</li>
                <li>구조</li>
                <li>문자</li>
                <li>링크</li>
                <li>부정</li>
            </ol>
        </div>
    </div>

    <div id="footer">
        <div class="left"></div>
        <div class="center"></div>
        <div class="right"></div>
    </div>
</body>
</html>
