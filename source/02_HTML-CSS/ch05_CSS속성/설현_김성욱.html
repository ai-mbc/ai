            margin: 0;
            padding: 0;
            box-sizing: border-box;

            min-height: 100vh;
            padding: 25px 12px;
            background-color: #ffffff;
            font-family: Arial, "맑은 고딕", sans-serif;

            overflow: visible;

        /* 내용 가독성을 위한 반투명 막 */
        #wrap::after {
            content: "";
            position: absolute;
            z-index: -1;
            inset: 0;
            background-color: rgba(239, 245, 247, 0.28);
            pointer-events: none;
        }

        header {
            height: 80px;
            border: 1px solid #999999;
            background-color: yellow;
            text-align: center;
            line-height: 80px;
            font-size: 13px;
        }

        nav {
            position: relative;
            z-index: 20;
            margin-top: 4px;
            padding: 10px 28px;
            overflow: visible;
            border: 1px solid #aaaaaa;
            background-color: rgba(245, 248, 249, 0.80);
            text-align: center;
        }

        nav h2 {
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: normal;
        }

        .main-menu {
            display: flex;
            list-style: none;
            border-radius: 18px;
            background-color: pink;
        }

        .menu-item {
            position: relative;
            flex: 1;
            min-width: 0;
            border-right: 1px solid #ffffff;
        }

        .menu-item:first-child {
            border-radius: 18px 0 0 18px;
        }

        .menu-item:last-child {
            border-right: none;
            border-radius: 0 18px 18px 0;
        }

        .menu-button,
        .menu-link {
            display: block;
            width: 100%;
            border: none;
            background: transparent;
            padding: 9px 4px;
            color: #7b245a;
            font: inherit;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .menu-button:hover,
        .menu-button:focus-visible,
        .menu-link:hover,
        .menu-link:focus-visible,
        .menu-item.open > .menu-button {
            outline: none;
            background-color: #ff9fba;
            color: #ffffff;
        }

        /* 서브메뉴 */
        .submenu {
            position: absolute;
            top: calc(100% + 3px);
            left: 0;
            z-index: 100;
            display: none;
            width: 100%;
            min-width: 120px;
            list-style: none;
            overflow: hidden;
            border: 1px solid #d68ca3;
            border-radius: 8px;
            background-color: rgba(255, 242, 247, 0.97);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
        }

        .submenu li + li {
            border-top: 1px solid #efc1cf;
        }

        .submenu a {
            display: block;
            padding: 9px 8px;
            color: #73304e;
            font-size: 12px;
            text-decoration: none;
            white-space: nowrap;
        }

        .submenu a:hover,
        .submenu a:focus-visible {
            outline: none;
            background-color: #ffc3d3;
            color: #4f1730;
        }

        /*
           PC: 마우스를 올리면 표시
           모바일/터치: JavaScript가 .open을 추가하면 표시
        */
        .menu-item:hover > .submenu,
        .menu-item:focus-within > .submenu,
        .menu-item.open > .submenu {
            display: block;
        }

        main {
            position: relative;
            z-index: 1;
            margin-top: 4px;
        }

        main::after {
            content: "";
            display: block;
            clear: both;
        }

        section {
            float: left;
            width: 78%;
            height: 245px;
            padding-top: 10px;
            border: 1px solid #aaaaaa;
            background-color: rgba(245, 248, 249, 0.46);
            text-align: center;
            font-size: 12px;
        }

        aside {
            float: right;
            width: 21%;
            height: 245px;
            padding-top: 10px;
            border: 1px solid #aaaaaa;
            background-color: rgba(245, 248, 249, 0.50);
            text-align: center;
            font-size: 12px;
        }

        footer {
            position: relative;
            z-index: 1;
            height: 72px;
            margin-top: 4px;
            border: 1px solid #999999;
            background-color: yellow;
            text-align: center;
            line-height: 72px;
            font-size: 13px;
        }

        /* 좁은 화면 대응 */
        @media (max-width: 600px) {
            nav {
                padding: 10px;
            }

            .main-menu {
                display: block;
                border-radius: 10px;
            }

            .menu-item {
                border-right: none;
                border-bottom: 1px solid white;
            }

            .menu-item:first-child {
                border-radius: 10px 10px 0 0;
            }

            .menu-item:last-child {
                border-bottom: none;
                border-radius: 0 0 10px 10px;
            }

            .submenu {
                position: static;
                width: 100%;
                border-right: none;
                border-left: none;
                border-radius: 0;
                box-shadow: none;
            }

            /*
               모바일에서는 hover가 남는 현상을 피하고
               클릭으로 열린 메뉴만 표시합니다.
            */
            .menu-item:hover:not(.open) > .submenu {
                display: none;
            }

            section,
            aside {
                float: none;
                width: 100%;
            }

            aside {
                height: 90px;
                margin-top: 4px;
            }
        }
    </style>
</head>

<body>
    <div id="wrap">
        <header>HEADER</header>

        <nav aria-label="주 메뉴">
            <h2>NAVIGATION</h2>

            <ul class="main-menu">
                <li class="menu-item">
                    <button class="menu-button"
                            type="button"
                            aria-expanded="false"
                            aria-controls="submenu1">
                        menu1
                    </button>

                    <ul class="submenu" id="submenu1">
                        <li><a href="#menu1-sub1">menu1-1</a></li>
                        <li><a href="#menu1-sub2">menu1-2</a></li>
                        <li><a href="#menu1-sub3">menu1-3</a></li>
                    </ul>
                </li>

                <li class="menu-item">
                    <button class="menu-button"
                            type="button"
                            aria-expanded="false"
                            aria-controls="submenu2">
                        menu2
                    </button>

                    <ul class="submenu" id="submenu2">
                        <li><a href="#menu2-sub1">menu2-1</a></li>
                        <li><a href="#menu2-sub2">menu2-2</a></li>
                        <li><a href="#menu2-sub3">menu2-3</a></li>
                    </ul>
                </li>

                <li class="menu-item">
                    <button class="menu-button"
                            type="button"
                            aria-expanded="false"
                            aria-controls="submenu3">
                        menu3
                    </button>

                    <ul class="submenu" id="submenu3">
                        <li><a href="#menu3-sub1">menu3-1</a></li>
                        <li><a href="#menu3-sub2">menu3-2</a></li>
                        <li><a href="#menu3-sub3">menu3-3</a></li>
                    </ul>
                </li>

                <li class="menu-item">
                    <button class="menu-button"
                            type="button"
                            aria-expanded="false"
                            aria-controls="submenu4">
                        menu4
                    </button>

                    <ul class="submenu" id="submenu4">
                        <li><a href="#menu4-sub1">menu4-1</a></li>
                        <li><a href="#menu4-sub2">menu4-2</a></li>
                        <li><a href="#menu4-sub3">menu4-3</a></li>
                    </ul>
                </li>

                <li class="menu-item">
                    <a class="menu-link" href="#menu5">menu5</a>
                </li>
            </ul>
        </nav>

        <main>
            <section>CONTENT</section>
            <aside>BANNER</aside>
        </main>

        <footer>FOOTER</footer>
    </div>

    <script>
        const menuItems = document.querySelectorAll(".menu-item");
        const menuButtons = document.querySelectorAll(".menu-button");

        function closeAllMenus(exceptItem = null) {
            menuItems.forEach((item) => {
                if (item !== exceptItem) {
                    item.classList.remove("open");

                    const button = item.querySelector(".menu-button");
                    if (button) {
                        button.setAttribute("aria-expanded", "false");
                    }
                }
            });
        }

        menuButtons.forEach((button) => {
            button.addEventListener("click", (event) => {
                event.stopPropagation();

                const currentItem = button.closest(".menu-item");
                const willOpen = !currentItem.classList.contains("open");

                closeAllMenus(currentItem);
                currentItem.classList.toggle("open", willOpen);
                button.setAttribute("aria-expanded", String(willOpen));
            });
        });

        document.addEventListener("click", () => {
            closeAllMenus();
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeAllMenus();
            }
        });
    </script>
</body>
