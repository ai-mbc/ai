<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <title></title>
  <style>
    table {width:350px; margin:20px auto; padding:20px 10px;}
    table, input[type='text'], input[type='password'] {
        border: 1px solid #385d81;
        outline: 1px solid #385d81;
        padding: 2px;
    }
    input[type='submit'], input[type='reset'], input[type='button'], button{
        background-color: #385d81;
        border:0; outline:0;
        color:white; 
        border-radius: 3px;
        padding:10px 20px;
        margin:5px;
    }
    td, th { padding:5px 10px; text-align:center;}
  </style>
  <script>
    function joinCheck(){
      var frm = document.frm;

      // 입력값 가져오기
      var name = frm.elements["name"].value.trim();
      var mail = frm.mail.value.trim();
      var pw = frm.pw.value;
      var pwChk = frm.pwChk.value;

      // 정규표현식 패턴
      var patternNum = /[0-9]/; // 숫자
      var patternUpEng = /[A-Z]/; // 대문자
      var patternLowEng = /[a-z]/; // 소문자
      var patternSpe = /[~`!@#$%^&*()_\-+=\|\\\[\]{}'":;?\/<>,\.]/; // 특수문자
      var patternEmail = /^\w+@\w+(\.\w+){1,2}$/; // 이메일 형식

      // 1. 이름 검사 : 비어 있으면 안 되고, 숫자/특수문자 사용 불가
      if(name == ""){
        alert("이름을 입력하세요");
        frm.elements["name"].focus();
        return false;
      }

      if(patternNum.test(name) || patternSpe.test(name)){
        alert("이름에는 숫자와 특수문자를 사용할 수 없습니다");
        frm.elements["name"].focus();
        return false;
      }

      // 2. 이메일 검사
      if(!patternEmail.test(mail)){
        alert("올바른 메일 형식이 아닙니다");
        frm.mail.focus();
        return false;
      }

      // 3. 비밀번호 검사
      // 소문자 + 대문자 + 숫자 + 특수문자를 모두 포함하고 4글자 이상
      if(pw.length < 4 ||
         !patternLowEng.test(pw) ||
         !patternUpEng.test(pw) ||
         !patternNum.test(pw) ||
         !patternSpe.test(pw)){
        alert("비밀번호는 소문자, 대문자, 숫자, 특수문자를 섞어서 4글자 이상 입력하세요");
        frm.pw.focus();
        return false;
      }

      // 4. 비밀번호 확인
      if(pw != pwChk){
        alert("비밀번호 두 개가 같지 않습니다");
        frm.pwChk.focus();
        return false;
      }

      alert("회원가입이 완료되었습니다");
      return true;
    }
  </script>
</head>
<body>
  <form action="#" name="frm" onsubmit="return joinCheck()">
    <table>
      <tr>
        <th>이름</th>
        <td>
          <input type="text" name="name" placeholder="특수문자와 숫자 못 와" 
                        autofocus="autofocus"/>
        </td>
      </tr>
      <tr>
        <th>메일</th>
        <td><input type="text" name="mail" placeholder="메일 형식에 맞추세요" /></td>
      </tr>
      <tr>
        <th>비밀번호</th>
        <td><input type="password" name="pw" placeholder="특수문자,알파벳,숫자 포함" /></td>
      </tr>
      <tr>
        <th>비밀번호</th>
        <td><input type="password" name="pwChk" /></td>
      </tr>
      <tr>
        <td colspan="2">
          <input type="submit" value="회원가입" />
          <input type="reset" value="취소" />
          <input type="button" value="로그인" />
        </td>
      </tr>
    </table>
  </form>
</body>
</html>
